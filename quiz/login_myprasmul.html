<html>
    <head>
        <title>Assignment3</title>
        <style>
            body {
                font-family: Arial;
                margin-top: 50px;
            }

            .login{
                width: 248px;
                margin: 0 auto;
            }

            .title {
                font-size :24px;
            }
            .subtitle {
                font-size :14px;
                color: #979797;
            }
            .circleinput {
                margin-top: 5px;
                border-radius: 10px;
                width: 240px;
                height: 25px;
                border: 1px solid #969494;
                padding-left: 5px;
            }
            .textinput {
                font-size: 14px;
                
            }
            .forgotpass {
                margin-top: 5px;
                text-align: right;
            }

            .signin {
                width: 248px;
                height: 30px;
                background-color: #091c70;
                color: white;
                border-radius: 10px;
                    
            }
            .donthaveaccount {
                text-align: center;
                font-size: 12px;
                color: #979797;
                margin-top: 10px;
            }

            .captcha_box {
                width: 220px;
                height: 60px;
                background-color: #e9e9e9;
                border-radius: 1px;
                margin: 0 auto;
                align-items: center;
                display : flex;
                align-items: center;
            }

            .bigcheckbox {
                width: 20px;
                height: 20px;
                margin: 10px
            }
        </style>
    </head>
    <body>
        <div class="login">
            <div class="title">
                Welcome
            </div>
            
            <div class="subtitle">
                Please enter your login credentials
            </div>
            
            <br>
            
            <div class="textinput">
                <label for="email">Email</label>
            </div>
            <input type="email" placeholder="Enter your email" class="circleinput" id="email" name="email">
            
            <br>
            <br>

            <div class="textinput">
                <label for="password">Password</label>
            </div>
            <input type="password" placeholder="Enter your password" class="circleinput" id="password" name="password">
            
            <br>
            
            <div class="forgotpass">
                <a href="">Forgot Password?</a>
            </div>

            <br>
            <div class="captcha_box">
                <input class="bigcheckbox" type="checkbox" id="captcha" name="captcha">
                <label for="captcha">Im not a robot</label>
            </div>
            
            <br>
            
            <button type="submit" class="signin">Sign In</button>
            
            <br>

            <div class="donthaveaccount">
                Don't have an account? <a href="">Sign Up</a>
            </div>
        </div>
    </body>
</html>
