<html>
    <head>
        <title>login_lms</title>
        <style>
            body {
                background-image: url(backgroundlms.jpg);
                font-family: Arial;
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 50px;
                }

            .image {
                margin-bottom: 15px;
            }
            .leftside {
                width:300px;
                height:300px;
                background-color: #e9e9e9;
                border-top-left-radius: 10px;
                border-bottom-left-radius: 10px;
                padding: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
        
                } 
            .rightside {
                width:300px;
                height:300px;
                background-color: #e9e9e9;
                border-top-right-radius: 10px;
                border-bottom-right-radius: 10px;
                padding: 10px;
                border-left: 1px solid #3a3a3a;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                font-size: 12px;
            }
            
            .circleinput {
                margin-top: 10px;
                border-radius: 10px;
                width: 240px;
                height: 30px;
                border: 1px solid #969494;
                padding-left: 10px;
                font-size: 12px;

            }
            .signin {
                width: 248px;
                height: 30px;
                background-color: #515152;
                color: white;
                border-radius: 10px;
                margin-top: 10px;
                font-size: 12px;
            }
            
            .forgotpass {
                margin-top: 10px;
                color:#515152;
                font-size: 12px;
            }
            .cookies {
                color: #515152;
                margin-top: 10px;
            }

        </style>
    </head>
    <body>
        <div class="leftside">
            <img class="image" src="logo-upm.png" width="250px">

            <input type="text" placeholder="Username or email" class="circleinput" id="email" name="email">
            
            <input type="password" placeholder="Password" class="circleinput" id="password" name="password">

            <button type="submit" class="signin">Log In</button>

            <a class="forgotpass" href="">Lost Password?</a>
        </div>
        <div class="rightside">
            <p>This site best viewed in Google Chrome</p>
            <div class="cookies">
                Cookies Notice
            </div>
        </div>
    </body>
</html>
